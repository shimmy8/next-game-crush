services:
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: next_game_crush
      POSTGRES_USER: next_game_crush
      POSTGRES_PASSWORD: next_game_crush
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_game_crush -d next_game_crush"]
      interval: 5s
      timeout: 5s
      retries: 10
  test-db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    profiles: ["test"]
    environment:
      POSTGRES_DB: next_game_crush_test
      POSTGRES_USER: next_game_crush_test
      POSTGRES_PASSWORD: next_game_crush_test
    ports:
      - "127.0.0.1:55432:5432"
    # Test data disappears when this container stops; never use the app volume.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U next_game_crush_test -d next_game_crush_test"]
      interval: 1s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      JOBS_ENABLED: ${JOBS_ENABLED:-1}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      DEMO_MODE_ENABLED: ${DEMO_MODE_ENABLED:-0}
      CATALOG_DISCOVERY_ENABLED: ${CATALOG_DISCOVERY_ENABLED:-0}
      CATALOG_REFRESH_CRON: ${CATALOG_REFRESH_CRON:-0 3 * * *}
      CATALOG_REFRESH_TIMEZONE: ${CATALOG_REFRESH_TIMEZONE:-Europe/Moscow}
      CATALOG_RECONCILIATION_CRON: ${CATALOG_RECONCILIATION_CRON:-0 4 * * 0}
      CATALOG_LOOKBACK_DAYS: ${CATALOG_LOOKBACK_DAYS:-30}
      CATALOG_HORIZON_DAYS: ${CATALOG_HORIZON_DAYS:-30}
      CATALOG_APPDETAILS_HOURLY_BUDGET: ${CATALOG_APPDETAILS_HOURLY_BUDGET:-1000}
      CATALOG_AI_HOURLY_BUDGET: ${CATALOG_AI_HOURLY_BUDGET:-100}
      CATALOG_WORKER_CONCURRENCY: ${CATALOG_WORKER_CONCURRENCY:-4}
      CATALOG_SEARCH_PAGE_SIZE: ${CATALOG_SEARCH_PAGE_SIZE:-100}
      CATALOG_SEARCH_MAX_PAGES_PER_FEED: ${CATALOG_SEARCH_MAX_PAGES_PER_FEED:-100}
      CATALOG_SEARCH_MAX_NEW_APPS_PER_RUN: ${CATALOG_SEARCH_MAX_NEW_APPS_PER_RUN:-20000}
      CATALOG_RECONCILIATION_PAGE_SIZE: ${CATALOG_RECONCILIATION_PAGE_SIZE:-100}
      STEAM_STORE_SERVICE_BASE_URL: ${STEAM_STORE_SERVICE_BASE_URL:-}
      ALLOWED_STEAM_ID: ${ALLOWED_STEAM_ID:-}
      STEAM_WEB_API_KEY: ${STEAM_WEB_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      DATABASE_URL: postgres://next_game_crush:next_game_crush@db:5432/next_game_crush?sslmode=disable
      SMTP_URL: smtp://mailpit:1025
      EMAIL_ACTION_SECRET: ${EMAIL_ACTION_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  postgres_data:
